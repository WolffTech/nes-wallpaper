name: Test Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build downloadable test app
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version
          test "$(uname -m)" = arm64

      - name: Run tests
        run: swift test

      - name: Assemble ad-hoc signed app
        run: ./Scripts/make-app.sh

      - name: Run emulator smoke test
        run: ./Scripts/smoke-test.sh

      - name: Verify app bundle
        run: ./Scripts/verify-app.sh

      - name: Create download disk image
        run: |
          ./Scripts/make-dmg.sh \
            "dist/NES Wallpaper.app" \
            "dist/NES-Wallpaper-test-build.dmg"

      - name: Upload test build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NES-Wallpaper-arm64-${{ github.run_number }}
          path: dist/NES-Wallpaper-test-build.dmg
          if-no-files-found: error
          retention-days: 14
