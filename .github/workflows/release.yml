name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Build, notarize, and publish
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Check release credentials
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          missing=0
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID SPARKLE_ED_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::missing repository secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # Full history: the build number is the commit count on the tag.
          fetch-depth: 0

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version
          test "$(uname -m)" = arm64

      - name: Derive version from tag
        run: |
          {
            echo "APP_VERSION=${GITHUB_REF_NAME#v}"
            echo "BUILD_NUMBER=$(git rev-list --count HEAD)"
          } >> "$GITHUB_ENV"

      - name: Run tests
        run: swift test

      - name: Run emulator smoke test
        run: ./Scripts/smoke-test.sh

      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -f pkcs12 -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Build, sign, notarize, and staple
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          NOTARY_KEY_FILE="$RUNNER_TEMP/notary-key.p8"
          printf '%s\n' "$NOTARY_KEY_P8" > "$NOTARY_KEY_FILE"
          trap 'rm -f "$NOTARY_KEY_FILE"' EXIT
          export NOTARY_KEY_FILE
          ./Scripts/notarize.sh

      - name: Verify app bundle
        run: ./Scripts/verify-app.sh

      # The EdDSA signature covers the exact DMG bytes, so this must run on
      # the final signed, notarized, and stapled image, and the very same
      # file must be the one uploaded below.
      - name: Generate Sparkle appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_VERSION: 2.9.5
          SPARKLE_SHA256: 015336b601493e05c237964954bff6191370003d94edefe663724c88840d73cc
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/Sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          echo "$SPARKLE_SHA256  $RUNNER_TEMP/Sparkle.tar.xz" | shasum -a 256 --check
          mkdir "$RUNNER_TEMP/sparkle-dist" "$RUNNER_TEMP/appcast-archives"
          tar -xJf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle-dist"
          # generate_appcast writes state next to its archives; give it a
          # copy so nothing touches the DMG that gets uploaded.
          cp "dist/NES-Wallpaper-$APP_VERSION.dmg" "$RUNNER_TEMP/appcast-archives/"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | \
            "$RUNNER_TEMP/sparkle-dist/bin/generate_appcast" \
              --ed-key-file - \
              --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
              --link "https://github.com/${GITHUB_REPOSITORY}" \
              -o dist/appcast.xml \
              "$RUNNER_TEMP/appcast-archives"
          cat dist/appcast.xml

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          DMG="dist/NES-Wallpaper-$APP_VERSION.dmg"
          APPCAST="dist/appcast.xml"
          SOURCE_ZIP="dist/NES-Wallpaper-$APP_VERSION-source.zip"
          git archive --format=zip \
            --prefix="NES-Wallpaper-$APP_VERSION/" \
            --output="$SOURCE_ZIP" \
            "$GITHUB_SHA"
          # A tag created through the GitHub release UI already has a release;
          # attach the artifacts to it. A plain pushed tag gets a new release.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$DMG" "$APPCAST" "$SOURCE_ZIP" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "NES Wallpaper $APP_VERSION" \
              --generate-notes \
              --verify-tag \
              "$DMG" "$APPCAST" "$SOURCE_ZIP"
          fi

      - name: Remove signing keychain
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/release.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/release.keychain-db"
          fi
