name: PR Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Lint workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint

      - name: Check workflow files
        run: |
          "$RUNNER_TEMP/actionlint" -color

  test:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            runner: macos-14
            developer_dir: /Applications/Xcode_15.4.app/Contents/Developer
          - name: current
            runner: macos-15
            developer_dir: /Applications/Xcode_16.4.app/Contents/Developer
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build all products
        run: swift build

      - name: Run tests
        run: swift test

  package:
    name: Package and smoke test
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version
          test "$(uname -m)" = arm64

      - name: Assemble ad-hoc signed app
        run: ./Scripts/make-app.sh

      - name: Run emulator smoke test
        run: |
          BIN_PATH="$(swift build -c release --show-bin-path)"
          FRAME_DIR="$RUNNER_TEMP/nes-wallpaper-frames"
          "$BIN_PATH/nes-headless" \
            TestData/nestest.nes \
            --frames 60 \
            --dump-every 60 \
            --out "$FRAME_DIR"
          test -n "$(find "$FRAME_DIR" -name '*.png' -print -quit)"

      - name: Verify app bundle
        run: |
          APP_PATH="dist/NES Wallpaper.app"
          test -x "$APP_PATH/Contents/MacOS/NESWallpaper"
          test -x "$APP_PATH/Contents/MacOS/nes-helper"
          file "$APP_PATH/Contents/MacOS/NESWallpaper" | grep -q 'arm64'
          file "$APP_PATH/Contents/MacOS/nes-helper" | grep -q 'arm64'
          codesign --verify --strict --deep "$APP_PATH"
