name: PR Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            runner: macos-14
            developer_dir: /Applications/Xcode_15.4.app/Contents/Developer
          - name: current
            runner: macos-15
            developer_dir: /Applications/Xcode_16.4.app/Contents/Developer
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build all products
        run: swift build

      - name: Run tests
        run: swift test

  package:
    name: Package and smoke test
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version
          test "$(uname -m)" = arm64

      - name: Assemble ad-hoc signed app
        run: ./Scripts/make-app.sh

      - name: Run emulator smoke test
        run: |
          BIN_PATH="$(swift build -c release --show-bin-path)"
          FRAME_DIR="$RUNNER_TEMP/nes-wallpaper-frames"
          "$BIN_PATH/nes-headless" \
            TestData/nestest.nes \
            --frames 60 \
            --dump-every 60 \
            --out "$FRAME_DIR"
          test -n "$(find "$FRAME_DIR" -name '*.png' -print -quit)"

      - name: Verify app bundle
        run: |
          APP_PATH="dist/NES Wallpaper.app"
          test -x "$APP_PATH/Contents/MacOS/NESWallpaper"
          test -x "$APP_PATH/Contents/MacOS/nes-helper"
          file "$APP_PATH/Contents/MacOS/NESWallpaper" | grep -q 'arm64'
          file "$APP_PATH/Contents/MacOS/nes-helper" | grep -q 'arm64'
          codesign --verify --strict --deep "$APP_PATH"
